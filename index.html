  why:'Twice-yearly cleanings remove the tartar you can\'t brush off and catch cavities while they\'re small fillings instead of root canals. Most dental insurance covers two cleanings a year at 100% - skipping them is leaving paid-for care on the table.',
  supplies:['Insurance card','List of any sensitivity, pain, or bleeding-gum spots you\'ve noticed','Your current medications list (some affect dental care)'],
  steps:['Book the appointment - if you don\'t have a dentist, your insurer\'s website lists in-network ones.','Before you go: note any teeth that have been sensitive to hot/cold/sweet, or gums that bleed when flossing.','At the visit: get the cleaning, ask about anything they find, and get X-rays when due (usually annually).','Ask the hygienist to show you where you\'re missing when brushing - it\'s usually the same spots every time.','Before leaving, book the next 6-month appointment - future-you will not remember to call.','Mark done here; the app will line up the next one in 6 months.'],
  tip:'Morning appointments get delayed less. And if it\'s been years since your last visit - dentists see that every day; just book it.' },

{ id:'health-physical', months:12, area:'health', domain:'health', time:'1 hr + lab visit',
  title:'Annual physical & blood work',
  why:'The annual physical is where silent issues - blood pressure, cholesterol, blood sugar, thyroid - get caught years before symptoms. Preventive visits are covered 100% by most insurance plans under ACA rules.',
  supplies:['Insurance card & photo ID','List of current medications and supplements with doses','Family health history updates (new diagnoses in parents/siblings)','Your list of questions - write them down, you will forget'],
  steps:['Book with your primary care doctor (or establish one - check your insurer\'s directory). Book labs for before the visit if your doctor prefers reviewing results with you.','If blood work includes a lipid panel or fasting glucose, fast 8-12 hours beforehand (water is fine - hydrate well, it makes the blood draw easier).','Bring up anything you\'ve been sitting on: sleep, stress, that thing you Googled. This is the visit for it.','Ask what your numbers are and what they were last year - trends matter more than single values. Ask for a portal copy.','Confirm you\'re current on age-appropriate screenings and vaccines (Tdap every 10 yrs, and screenings your doctor recommends by age/history).','Book any referrals (derm, eye) while scheduling momentum is high. Mark done here.'],
  tip:'Keep a running note on your phone all year titled "for the doctor" - anything odd goes in it. Best 30 seconds of health admin there is.' },

{ id:'health-eye', months:12, area:'health', domain:'health', time:'1 hr appointment',
  title:'Eye exam',
  why:'Eye exams check far more than glasses prescriptions - they catch glaucoma, retinal issues, and even early diabetes and high blood pressure (the retina is the one place blood vessels are visible directly). Screen time makes prescriptions drift faster than people expect.',
  supplies:['Vision insurance card (often separate from medical)','Current glasses and/or contact lens boxes (so they know your current prescription)','Sunglasses for the drive home if your pupils get dilated'],
  steps:['Book with an optometrist (routine) - vision plans typically cover one exam per year.','Mention: headaches, eye strain, dry eyes, night-driving glare, or more frequent squinting at screens.','Get the full exam including the retinal check (dilation or retinal photo).','Ask whether your prescription actually changed enough to need new lenses - sometimes it hasn\'t.','Contact lens wearers: this is when your fitting/prescription renews (it legally expires annually).','Mark done; the app queues next year\'s.'],
  tip:'20-20-20 for screen strain: every 20 minutes, look at something 20 feet away for 20 seconds. Cheap, and it works.' },

{ id:'health-derm', months:12, area:'health', domain:'health', time:'30 min appointment',
  title:'Skin check (dermatologist) + monthly self-checks',
  why:'Skin cancer is the most common cancer - and the most curable when caught early. An annual full-body check by a dermatologist takes 15 minutes; melanoma caught early has a ~99% survival rate.',
  supplies:['Insurance card (may need a referral - check your plan)','Notes/photos of any moles or spots that changed this year'],
  steps:['Book an annual full-body skin exam with a dermatologist (book far ahead - derm wait times are long; put it on the calendar as soon as you mark this done).','Before the visit, note anything matching the ABCDEs: Asymmetry, Border irregularity, Color variation, Diameter >6mm (pencil eraser), Evolving/changing.','At the visit, point out anything new or changed - don\'t assume they\'ll spot it.','Between visits, do a quick monthly self-scan after a shower (use a mirror or phone camera for your back and scalp).','Daily habit that outweighs everything else: SPF 30+ on face/neck/hands.','Mark done here.'],
  tip:'The spot to watch isn\'t the dark scary-looking mole you\'ve had forever - it\'s the one that CHANGED. Photos with a coin for scale make change obvious.' },

{ id:'health-flu', months:12, area:'health', domain:'health', time:'15 min',
  title:'Flu shot (and vaccine check)',
  why:'The flu costs you 1-2 miserable weeks a year on average odds; the shot costs 15 minutes and is free with insurance at any pharmacy. September-October timing gives you protection through the whole season.',
  supplies:['Insurance card','Short sleeves'],
  steps:['Book at any pharmacy (walk-ins usually fine) or your doctor\'s office - ideally September/October.','While you\'re there, ask what else you\'re due for: COVID booster, Tdap (every 10 years), and age-appropriate others.','Get it in your non-dominant arm; move the arm around that day to reduce soreness.','Update your vaccine record (photo of the card in your phone works).','Mark done here - the app will resurface it next fall.'],
  tip:'Mild arm soreness or feeling off for a day = normal immune response, not the flu. The shot cannot give you the flu.' },

{ id:'health-toothbrush', months:3, area:'health', domain:'health', time:'2 min',
  title:'Replace toothbrush / brush head',
  why:'After ~3 months, bristles are frayed and clean dramatically worse - dentists\' most-repeated cheap advice. Also replace after any illness.',
  supplies:['New toothbrush or electric brush head (buy multi-packs)','Floss restock while you\'re at it'],
  steps:['Swap the brush/head for a fresh one.','Check your floss/picks supply and restock.','If anyone in the house was recently sick, swap theirs too.','Mark done - next reminder in 3 months.'],
  tip:'Subscribe-and-save on brush heads makes this task automatic - the reminder becomes "open the drawer".' },

{ id:'health-meds', months:6, area:'health', domain:'health', time:'20 min',
  title:'Medicine cabinet & first-aid audit',
  why:'Expired meds lose potency (and a few become harmful), and the first-aid kit is always missing exactly what you need. Twice a year keeps the home pharmacy actually useful.',
  supplies:['Trash bag','Restock list: bandages, antibiotic ointment, pain relievers, antihistamine, thermometer batteries, cold medicine'],
  steps:['Pull everything from the medicine cabinets and first-aid kit(s).','Check every expiration date. Expired → out. (Most meds: drop at a pharmacy take-back kiosk; FDA flush-list meds like certain painkillers should be flushed; the rest can go in trash mixed with coffee grounds.)','Restock the basics: pain relievers, antihistamines (allergy + reaction), antacids, anti-diarrheal, bandages in real sizes, antibiotic ointment.','Check the thermometer works.','Make sure prescription meds are current and refills aren\'t about to lapse.','Store nothing in the bathroom you rely on long-term - humidity degrades meds; a bedroom closet shelf is better.'],
  tip:'Keep a mini kit in each car too (see the car emergency-kit task) - audit them the same day.' },

{ id:'health-mental', months:1, area:'health', domain:'health', time:'20 min',
  title:'Mental wellness check-in',
  why:'Mental health needs preventive maintenance just like the HVAC - small monthly check-ins catch stress, burnout, and low mood while they\'re easy to course-correct, instead of after they\'ve compounded for a year.',
  supplies:['A quiet 20 minutes','Notes app or journal'],
  steps:['Rate the last month honestly, 1-10: mood, sleep quality, energy, stress. Jot the numbers - the trend across months tells you more than any single one.','Name your top stressor right now. Is there one concrete action that would shrink it? Schedule that action.','Sleep audit: are you getting 7+ hours most nights? If not, what\'s the actual thief - screens, caffeine timing, schedule? Pick one fix.','Connection: when did you last have real time with a friend or family member? Put one social thing on the calendar this month.','Screen/news hygiene: check your phone\'s screen-time report; if it\'s creeping up, set one boundary (no phone in bed is the classic).','Do one thing that reliably recharges you this week - and actually schedule it, don\'t just intend it.','If your mood has been consistently low, anxious, or flat for 2+ weeks, treat that like the check-engine light: talk to your doctor or a therapist. That\'s maintenance, not failure.'],
  tip:'The monthly numbers are the whole trick - "sleep has been a 4 for three months" is actionable in a way vague unease never is.' },

{ id:'health-fitness', months:'w', target:4, area:'health', domain:'health', time:'30+ min per workout',
  title:'Workout - goal 4× per week',
  why:'Exercise is the single highest-return preventive maintenance you can do on yourself - heart, joints, sleep, mood, long-term health span. The goal here is 4 workouts a week; log each one and the week completes at 4.',
  supplies:['Whatever your workout needs - shoes, gym access, a mat, or just a sidewalk'],
  steps:['Anything intentional counts as one workout: gym session, run, brisk 30-minute walk, bike ride, swim, sport, home strength workout, long hike.','Aim for a mix across the week: 2-3 cardio + 1-2 strength is a great default (strength training matters more every year you age).','Tap "Log workout" here each time you finish one - the badge tracks your count for the current week (Mon-Sun).','Hit 4 and the week shows complete ✓. The counter resets every Monday.','Missed a day? Don\'t chase perfection, just get the next one in. Consistency across months beats any single week.'],
  tip:'Schedule workouts like appointments at the start of the week - the 4× weeks are almost always the ones that were planned, not squeezed in.' },

/* ================================= PETS ================================= */
{ id:'pet-flea', months:1, area:'pets', domain:'pets', time:'5 min', video:'how to apply flea tick and heartworm prevention dog cat',
  title:'Flea, tick & heartworm prevention dose',
  why:'Monthly preventives only work if they\'re actually given monthly - a lapsed dose is how infestations and heartworm (which is expensive and dangerous to treat) get in. This is the most important 5 minutes of pet care each month.',
  supplies:['Your pet\'s monthly preventive (topical or chewable, as prescribed by your vet)','Treats for cooperation'],
  steps:['Give the monthly dose per its directions - chewables with food; topicals parted into the skin at the back of the neck.','Mark it done here the moment you give it (the whole point is the streak).','Do a quick flea/tick spot-check while you\'re at it: part the fur at the neck, base of tail, and belly.','Check your supply - reorder when you open the second-to-last dose.','If a dose was missed by more than 2 weeks, ask your vet whether a heartworm test is needed before resuming.'],
  tip:'Give it the same day you check tire pressure or pay rent - anchoring it to an existing monthly habit is what makes it never slip.' },

{ id:'pet-groom', months:1, area:'pets', domain:'pets', time:'30 min', video:'how to trim dog cat nails safely at home',
  title:'Nail trim & grooming session',
  why:'Overgrown nails change how pets walk and can cause joint pain; matted fur hides skin problems. A monthly session keeps it a calm routine instead of a dreaded battle.',
  supplies:['Pet nail clippers or grinder','Styptic powder (in case you nick the quick)','Brush suited to their coat','Treats - lots'],
  steps:['Trim nails in good light: clip small amounts, staying clear of the quick (the pink core in light nails; on dark nails, stop at the chalky white ring).','If a nail bleeds, press styptic powder on it and give the drama a minute to pass.','Brush the coat thoroughly - check for mats, burrs, and anything stuck.','While brushing, run your hands over the whole body: you\'re feeling for lumps, scabs, ticks, or tender spots.','Wipe ears out gently with a damp cotton pad (outer ear only) - dark gunk or odor means a vet look.','End with a treat so next month\'s session starts on credit.'],
  tip:'If nails click on the floor, they\'re overdue. Can\'t face nail trims? A groomer does them for a few dollars - the schedule matters more than who does it.' },

{ id:'pet-health', months:3, area:'pets', domain:'pets', time:'15 min', video:'at home pet health check dog cat weight teeth',
  title:'At-home health check: weight, teeth, ears, coat',
  why:'Pets hide illness instinctively - quarterly hands-on checks catch weight drift, dental disease, and lumps months before they\'d otherwise be noticed. Weight alone is huge: obesity shortens pet lives by ~2 years.',
  supplies:['Bathroom scale (weigh yourself, then holding the pet, subtract)','Flashlight','Notes app for the numbers'],
  steps:['Weigh them and log it here in the notes of your mark-done date. More than ~10% change since last quarter without a diet change = vet call.','Rib check: you should feel ribs easily under a thin fat layer, and see a waist from above. Can\'t feel ribs → measure meals, cut treats.','Lift the lips: look for red gums, heavy tartar, broken teeth, or bad breath beyond normal - dental disease is the most common (and most ignored) pet health issue.','Check eyes (clear, no discharge), ears (clean, no odor), and paws (pads intact, nothing between toes).','Watch them move: any new stiffness, limping, or hesitation on stairs?','Note anything off and bring the list to the annual vet visit - or sooner if it\'s getting worse.'],
  tip:'Photograph your pet standing, from above and the side, each quarter - weight creep is invisible day-to-day and obvious in photos.' },

{ id:'pet-gear', months:3, area:'pets', domain:'pets', time:'45 min', video:'how to deep clean pet beds bowls toys litter area',
  title:'Deep clean pet gear: beds, bowls, toys, litter/crate',
  why:'Pet bowls are consistently among the germiest items in any home, and beds collect dander, oils, and whatever was on the last walk. A quarterly deep clean keeps the pet zone from becoming the smell zone.',
  supplies:['Hot water & dish soap','Washing machine for bed covers','Enzyme cleaner (for any accident spots)','Baking soda'],
  steps:['Run food and water bowls through the dishwasher on hot (do this weekly ideally - quarterly is the deep audit: toss scratched plastic bowls, which harbor bacteria; stainless or ceramic is better).','Wash bed covers and blankets on hot; sprinkle baking soda on the mattress part, let sit, vacuum.','Wash or replace fabric toys; scrub rubber ones; toss anything shredded into choking-hazard territory.','Litter box (cats): empty fully, scrub with mild soap (no strong chemicals - they\'ll boycott it), dry, fresh litter. Replace the whole box yearly.','Crate/carrier: scrub the tray, vacuum crevices, air out.','Vacuum the pet\'s favorite zones and wash leashes/collars/harnesses in soapy water - check the collar fits (two fingers flat underneath).'],
  tip:'Keep a cheap cordless vacuum near the pet zone - the 30-second daily pass is what makes the quarterly deep clean easy.' },

{ id:'pet-vet', months:12, area:'pets', domain:'pets', time:'1 hr appointment',
  title:'Annual vet wellness exam & vaccines',
  why:'One dog/cat year ≈ 4-7 human years, so an annual exam is like you going every 5 years - it\'s the minimum. Boosters, parasite screening, and bloodwork baselines catch the expensive stuff early.',
  supplies:['Vaccine records','Your quarterly health-check notes (weight trend, anything odd)','Fresh stool sample if your vet asks for one','Carrier/leash and treats'],
  steps:['Book the annual exam (senior pets 7+: ask about twice-yearly).','Bring your notes: weight trend, any lumps, stiffness, dental observations from the quarterly checks.','Get due vaccines/boosters (rabies, core vaccines per your region and lifestyle).','Ask for the annual heartworm test and parasite screen; renew the year\'s flea/tick/heartworm prescription while there.','For pets 7+, ask about baseline bloodwork - trends across years are how kidney/liver issues get caught early.','Book next year\'s slot before leaving and mark this done.'],
  tip:'Bring the pet hungry and the treats high-value - vet visits that end as treat parties get easier every year, not harder.' },

{ id:'pet-admin', months:12, area:'pets', domain:'pets', time:'20 min',
  title:'Pet admin: license, microchip, insurance, supplies',
  why:'The paperwork layer of pet ownership: an expired license is a fine, an outdated microchip registration means a found pet can\'t find you, and pet insurance quietly rate-creeps like every other insurance.',
  supplies:['Microchip number (on adoption/vet paperwork)','Pet insurance policy if you have one'],
  steps:['Renew the pet license if your city/county requires one.','Look up the microchip registry and verify your phone number and address are current - this is the one that matters if they ever get out.','Update the physical ID tag if any info changed; check it\'s still legible.','Pet insurance: review premium vs. what you\'ve claimed; compare a quote or two, or reconsider whether a dedicated savings buffer suits you better.','Check food/meds supply chain: autoship quantities still right for their weight? Stock of any daily medication?','Update your emergency plan: who takes the pet if you\'re traveling or in a pinch? Is the go-bag (food, meds, records copy) current? (Tie-in: the Life Admin emergency task.)'],
  tip:'Photo of the vaccine record + microchip number in a phone album named after your pet = boarding, grooming, and travel paperwork solved forever.' },

/* ============================== LIFE ADMIN ============================== */
{ id:'la-money', months:1, area:'admin', domain:'admin', time:'30 min',
  title:'Monthly money check-in',
  why:'Thirty minutes a month prevents the two most common money leaks: quiet subscription creep and fraud you don\'t notice for 90 days. It also keeps the budget honest without daily tracking.',
  supplies:['Bank & credit card apps/statements','Your budget or spending app if you use one'],
  steps:['Scan every account\'s last month of transactions - flag anything you don\'t recognize immediately (fraud disputes have time windows).','List the subscriptions that charged this month. Cancel anything you didn\'t use twice. (Check app-store subscriptions too - that\'s where they hide.)','Compare spending vs. income for the month - not to judge, just to see the number. Trend beats perfection.','Confirm automatic transfers happened: savings, retirement contributions, any extra debt payments.','Check credit card balances are being paid in full (or the payoff plan is on track).','Anything bugging you financially? Write it down for the quarterly/annual tasks instead of letting it float.'],
  tip:'Same day every month (payday works well). The check-in staying boring is the sign it\'s working.' },

{ id:'la-credit', months:3, area:'admin', domain:'admin', time:'20 min',
  title:'Credit report check (rotate bureaus)',
  why:'Your credit report is where identity theft shows up first - and errors on it quietly cost you on every future loan. Reports from all three bureaus are free weekly at the official site; checking one per quarter keeps continuous coverage.',
  supplies:['annualcreditreport.com (the only official free site)','Your ID info for verification'],
  steps:['Go to annualcreditreport.com and pull ONE bureau\'s report this quarter (rotate: Equifax → Experian → TransUnion → repeat).','Scan accounts: anything you didn\'t open? Any address or employer you don\'t recognize? That\'s the identity-theft tell.','Check for errors: wrong late payments, closed accounts showing open, balances that are way off. Dispute errors on the bureau\'s site - it\'s free and they must investigate.','Glance at hard inquiries: any you didn\'t authorize?','If you\'re not planning to open credit soon, consider freezing your credit at all three bureaus - free, reversible online in minutes, and the single best identity-theft protection that exists.','Note your credit score trend (your bank/card app shows it free).'],
  tip:'A credit freeze sounds drastic and isn\'t - you unfreeze online in five minutes when you actually need a loan, and thieves can\'t open anything meanwhile.' },

{ id:'la-emergency', months:6, area:'admin', domain:'admin', time:'45 min',
  title:'Emergency preparedness review',
  why:'Emergencies are exactly the thing you can\'t prepare for during. Twice a year: water, food, light, documents, and a plan - so a bad day stays a story instead of becoming a crisis.',
  supplies:['Water (1 gal/person/day × 3 days)','Shelf-stable food (3 days)','Flashlights + batteries','First-aid kit','Phone power bank (charged)','Copies of key documents','Some cash in small bills'],
  steps:['Check/refresh the home kit: replace expiring water and food, test flashlights, recharge power banks.','Documents: confirm you have copies (physical or encrypted digital) of IDs, insurance policies, deed, titles, and key contacts. Photograph your home room-by-room for insurance while you\'re at it - 5 minutes, huge claim leverage.','Review the family plan: where do you meet if separated? Who\'s the out-of-area contact? Does everyone know?','Know your shutoffs (you\'ve got this from the home tasks): water main, breaker panel, gas valve if applicable - could everyone in the house do it?','Check smoke/CO readiness ties (detector tasks) and fire extinguisher locations.','Local risks pass: for your area, what\'s realistic - extended power outage, winter storm, flooding? One prep item for the top risk.','Cash check: ATMs and cards don\'t work in an outage; keep a modest stash in small bills.'],
  tip:'The 72-hour standard exists because most emergencies resolve in three days - build for three days and you\'ve covered the overwhelming majority of scenarios.' },

{ id:'la-tax', months:12, area:'admin', domain:'admin', time:'2-4 hr in season',
  title:'Tax prep & credits review',
  why:'Filing is mandatory; overpaying is optional. An annual organized pass - documents gathered early, credits actually claimed - is worth hundreds to thousands, and kills the April panic.',
  supplies:['Last year\'s return','W-2/1099s as they arrive (Jan-Feb)','Mortgage interest (1098), property tax records','Receipts for deductible items','A folder (physical or digital) labeled with the tax year'],
  steps:['January: make the folder; drop every tax document in as it arrives. This single habit is 80% of tax prep.','Review credits you may qualify for this year: child/dependent credits, education credits, energy-efficiency home improvements (new HVAC, water heater, insulation can qualify!), EV credit if you bought one, retirement saver\'s credit.','As a homeowner: compare itemizing (mortgage interest + property taxes + charitable) vs. standard deduction - run it both ways or let software do it.','Check withholding: big refund = interest-free loan you gave the government; big bill = adjust your W-4 now for next year.','File (software or CPA - if your year had a house purchase, equity events, or side income, a CPA often pays for itself).','Confirm max-out progress on tax-advantaged accounts: 401(k) match at minimum, IRA, HSA if eligible - the deadline for IRA/HSA is tax day.','Store the filed return and folder - seven years of returns kept.'],
  tip:'That energy-credit rule is worth remembering all year: before any big home system purchase (HVAC, water heater, windows), check current federal/state credits first - it can swing which model you buy.' },

{ id:'la-insurance', months:12, area:'admin', domain:'admin', time:'1 hr',
  title:'Insurance & coverage annual review',
  why:'Insurance is set-and-forget by design - theirs, not yours. Rates creep for loyal customers, coverage gaps appear as your life changes, and ten minutes of comparison routinely saves real money.',
  supplies:['Current policy declaration pages: home/condo (HO-6 for a townhome), auto, umbrella, life, disability','Rough inventory of what\'s changed this year'],
  steps:['Pull each policy\'s declarations page and check the premium vs. last year - anything that jumped >10% gets shopped.','Townhome policy (HO-6): confirm the dwelling/interior coverage still matches reality (renovations? higher rebuild costs?) and that you understand what the HOA\'s master policy covers vs. yours ("walls-in" vs "studs-in" matters).','Auto: coverage limits still sensible? (State minimums are usually too low if you have assets.) Get 2-3 quotes - you did this in the car task; count it once, either place.','Consider/review umbrella coverage: ~$200-400/yr for $1M of liability protection over everything else - the cheapest serious protection there is once you own property.','Life & disability: does coverage still match your obligations (mortgage, dependents)? Employer coverage usually isn\'t portable or sufficient on its own.','Check beneficiaries on EVERY policy and account - outdated beneficiaries are the classic quiet disaster.','Document everything insured: update that room-by-room photo/video inventory.'],
  tip:'Bundling discounts are real but not automatic - re-quote the bundle vs. separates each year; the winner flips more often than you\'d think.' },

{ id:'la-travel', months:12, area:'admin', domain:'admin', time:'30 min',
  title:'Travel readiness check',
  why:'Passports take 6-8+ weeks to renew and many countries require 6 months of validity beyond your trip - the annual check is what prevents discovering this three weeks before the flight.',
  supplies:['Passports','Driver\'s licenses','Airline/hotel loyalty account logins'],
  steps:['Check every household passport\'s expiration: renew if under 12 months remaining (many countries deny entry under 6 months of validity).','Driver\'s license expiration and REAL ID status - you need REAL ID (or a passport) for domestic flights.','Global Entry / TSA PreCheck: check expiration (5-year cycles, renewals open a year early and can be done online).','Sweep loyalty points: airlines/hotels expire points after inactivity in some programs - a $1 activity resets most clocks.','Check any travel credit card benefits you\'re paying an annual fee for: travel credits, lounge access, free hotel nights - use or drop.','Digital prep: copies of passports in secure cloud storage; know your card\'s international fees and your phone plan\'s roaming story.'],
  tip:'Renew passports in the fall - it\'s the application off-season, and processing is fastest before the spring/summer rush.' },

{ id:'la-legal', months:12, area:'admin', domain:'admin', time:'1-2 hr',
  title:'Legal & estate documents review',
  why:'The uncomfortable one that matters most: if something happens to you, documents decide everything. One annual hour keeps your will, beneficiaries, and permissions matching your actual life.',
  supplies:['Existing will/trust documents if any','List of accounts with beneficiary designations','A safe place (fireproof box / safe deposit / encrypted vault)'],
  steps:['Will: do you have one? If not, this year\'s task is creating one (online services handle simple estates affordably; a lawyer for anything complex). If yes: does it still reflect your wishes and assets?','Beneficiaries audit: 401(k), IRAs, life insurance, bank TOD/POD designations - these override your will, and outdated ones (an ex, a deceased relative) are the most common estate disaster.','Powers of attorney: financial POA and healthcare directive/proxy - who decides if you can\'t? Documents signed and shared with that person?','Digital estate: password manager emergency access set up? Someone can reach critical accounts if needed?','Document locations: does someone you trust know where the will, deed, titles, and policies are?','Titles & deed check: home deed, car titles - filed safely, reflecting current reality?','Update anything stale; re-store everything in the safe place; done for the year.'],
  tip:'The barrier here is emotional, not practical - book it like a dentist appointment and it\'s done in an afternoon. Future-someone will be very grateful.' },

{ id:'la-device', months:3, area:'admin', domain:'admin', time:'30 min',
  title:'Device PM: backups, updates, storage, battery',
  why:'Phones and laptops fail like any machine, and the only disaster version is the one without a backup. A quarterly device pass means a lost or dead device is an inconvenience, not a catastrophe.',
  supplies:['Your phone, laptop, tablet','Cloud backup account logins (iCloud / Google / etc.)'],
  steps:['Verify backups are actually running: phone backup timestamp is recent, photos are syncing to the cloud, laptop backup (Time Machine / cloud) shows a recent date. A backup you have never tested is a hope, not a backup - spot-restore one file or photo.','Install pending OS and app updates on every device (security patches are the point, not the features).','Storage check: keep at least 15% free on each device; clear downloads folders, old videos, unused apps.','Battery health: check the phone battery health screen - below ~80%, plan a battery replacement (far cheaper than a new phone).','Clean physically: ports (dry brush), screens, keyboard. Restart everything - the classic fix, quarterly at minimum.','Old device drawer: any retired phones/tablets? Wipe them and trade in, sell, or recycle - they lose value every quarter they sit.'],
  tip:'Set photo backup to automatic-over-wifi and this task becomes a 10-minute verification instead of an anxiety session.' },

{ id:'la-passwords', months:6, area:'admin', domain:'admin', time:'45 min',
  title:'Digital security sweep: passwords, 2FA, breach check',
  why:'Reused passwords are how one leaked site becomes your email, bank, and identity. Twice a year: audit, patch the weak spots, and check whether your accounts appear in known breaches.',
  supplies:['A password manager (if you do not use one, adopting one IS this task)','10 minutes on haveibeenpwned.com'],
  steps:['Run your password manager\'s health/audit report: fix reused and weak passwords, starting with email, banking, and anything with a card on file.','Check your email addresses at haveibeenpwned.com - if a breach lists a password you still use anywhere, change it today.','Two-factor authentication coverage: email, bank, investment, and password manager accounts all need it - app-based (authenticator) beats SMS.','Review account recovery: are your recovery phone/email current on the big accounts?','Review third-party access: in your Google/Apple/Microsoft account settings, revoke apps you no longer use.','Check the family angle: shared streaming/wifi passwords fine, but banking credentials should never live in a text thread - move them to shared password-manager entries.'],
  tip:'The single highest-value move: unique password + authenticator-app 2FA on your primary email, because email resets everything else.' },

{ id:'la-relationship', months:3, area:'admin', domain:'admin', time:'30 min planning',
  title:'Relationship PM: family, friends, connection',
  why:'Relationships decay by default, not by decision - the months just pass. A quarterly check keeps the important people actively in your life instead of on the someday list. Decades of research says close relationships are the strongest predictor of long-term happiness there is.',
  supplies:['Your calendar','Phone contacts'],
  steps:['Partner/closest person: is there regular one-on-one time on the calendar (a real recurring date night or equivalent)? If not, book the next two now.','Parents and family: when did you last actually call (not text)? Schedule the call. If they are far away, put a visit on the horizon with a rough date.','Friends: name your 3-5 closest friendships. Anyone you have not seen or properly spoken to in over a quarter? Send the message now, not after this task.','Look at the next quarter\'s birthdays and occasions; put reminders in the calendar so you are early, not apologetic.','Appreciation: tell one person, concretely, something you appreciate about them this week. Cheap to give, remembered for years.','New connection: one invite that expands the circle - a neighbor, a colleague, the friend-of-friend you always get along with.'],
  tip:'The 8-minute rule: most bids for connection take one 8-minute call. When someone crosses your mind, that is the task - call them then.' },

{ id:'la-career', months:6, area:'admin', domain:'admin', time:'1-2 hr',
  title:'Career PM: resume, skills, market value, network',
  why:'The worst time to update a resume is when you suddenly need one. Twice a year, capture your wins while they are fresh, check your market value, and keep the network warm - opportunity favors the maintained career.',
  supplies:['Your resume file','LinkedIn login','A running "wins" note (start one today if none exists)'],
  steps:['Update the resume with the last 6 months: projects shipped, numbers moved, skills gained. Write achievements with outcomes ("cut X by 30%"), not duties.','Refresh LinkedIn to match; a current profile quietly attracts options even when you are not looking.','Market value check: browse comparable roles and their posted salary ranges (many states require them now). Know your number.','Skills: what does your field reward in the next 2-3 years? Pick one skill and schedule the learning (course, cert, project) - calendar it or it will not happen.','Network: message 2-3 former colleagues or industry contacts just to catch up. No ask, just warmth - that is what makes future asks natural.','Zoom out: are you where you want to be trajectory-wise? If the answer bothers you two reviews in a row, that is data worth acting on.','At work: keep a brag document of wins - it writes your next review, resume, and promotion case for you.'],
  tip:'Do this in January and July: right before review cycles and right before the fall hiring wave.' },

{ id:'la-benefits', months:12, area:'admin', domain:'admin', time:'1 hr in enrollment season',
  title:'Workplace benefits & open enrollment review',
  why:'Open enrollment is the one week a year your compensation is adjustable - and defaults quietly cost money. Most people never change elections they set years ago.',
  supplies:['Benefits portal login','Last year\'s elections summary','Pay stub'],
  steps:['Calendar your employer\'s open enrollment window now so it never sneaks past.','401(k): are you getting the FULL employer match (that is a 100% return)? Bump your contribution 1% - you will not feel it, future-you will.','Health plan: re-run the math on plan options against how you actually used healthcare this year; an HSA-eligible plan plus funded HSA is a triple-tax-advantaged sleeper if it fits.','FSA: fund realistically (use-it-or-lose-it) for known expenses - dental work, glasses, dependent care.','Check the ignored benefits list: legal plan, employee stock purchase (ESPP - often free money if you can float it), gym/wellness stipends, learning budgets, employer life/disability top-ups.','Verify beneficiaries on the employer 401(k) and life insurance (they are separate from your other accounts and get missed).','Update tax withholding if your life changed (marriage, house, dependents).'],
  tip:'The 1%-a-year 401(k) bump is the painless path: raise it every enrollment until you hit the max - you adapt to each step without noticing.' },

{ id:'la-possessions', months:6, area:'admin', domain:'admin', time:'2 hr',
  title:'Possessions PM: declutter, warranties, inventory',
  why:'Stuff accumulates interest in reverse - it costs space, cleaning time, and mental load. A twice-yearly pass keeps the home lean, the warranties findable, and the insurance inventory current.',
  supplies:['Donation box','Trash bag','Phone camera','A folder (physical or digital) for receipts & warranties'],

/* ============================== DATE HELPERS ============================== */
const DAY = 86400000;
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function parseISO(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addMonths(dt, m) { const d = new Date(dt); const day = d.getDate(); d.setMonth(d.getMonth() + m); if (d.getDate() < day) d.setDate(0); return d; }
function fmt(dt) { return dt.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: dt.getFullYear() === new Date().getFullYear() ? undefined : 'numeric' }); }
function fmtISO(s) { return fmt(parseISO(s)); }
function daysBetween(a, b) { return Math.round((b - a) / DAY); }

function freqLabel(m) { return m === 'w' ? 'Weekly' : m === 1 ? 'Monthly' : m === 3 ? 'Quarterly' : m === 6 ? 'Semi-Annual' : 'Annual'; }
function lastDone(task) { const c = data.completions[task.id]; return c && c.length ? c[c.length - 1] : null; }
function weekCount(task) {
  const today = parseISO(todayISO());
  const ws = new Date(today); ws.setDate(today.getDate() - ((today.getDay() + 6) % 7)); // Monday
  return (data.completions[task.id] || []).filter(d => { const dt = parseISO(d); return dt >= ws && dt <= today; }).length;
}
function taskStatus(task) {
  if (task.months === 'w') {
    const c = weekCount(task), target = task.target || 4;
    if (c >= target) return { key: 'ok', label: `✓ ${c}/${target} this week`, sort: 3, detail: `Weekly goal met - counter resets Monday` };
    if (c > 0) return { key: 'soon', label: `${c}/${target} this week`, sort: 1, detail: `${target - c} more workout${target - c > 1 ? 's' : ''} to complete this week` };
    return { key: 'soon', label: `0/${target} this week`, sort: 1, detail: `Log ${target} workouts this week (Mon-Sun)` };
  }
  const last = lastDone(task);
  const today = parseISO(todayISO());
  if (!last) return { key: 'never', label: 'Not started', sort: 1, detail: 'Never done - tap to see how' };
  const due = addMonths(parseISO(last), task.months);
  const days = daysBetween(today, due);
  const window_ = task.months === 1 ? 5 : task.months === 3 ? 14 : 21;
  if (days < 0) return { key: 'overdue', label: 'Overdue ' + Math.abs(days) + 'd', sort: 0, due, detail: 'Was due ' + fmt(due) };
  if (days === 0) return { key: 'overdue', label: 'Due today', sort: 0, due, detail: 'Due today' };
  if (days <= window_) return { key: 'soon', label: 'Due in ' + days + 'd', sort: 2, due, detail: 'Due ' + fmt(due) };
  return { key: 'ok', label: 'Done ✓', sort: 3, due, detail: 'Next due ' + fmt(due) };
}
const STATUS_ICON = { overdue: '⚠️', soon: '🔔', ok: '✅', never: '◌' };

function dTasks() { return TASKS.filter(t => domain === 'all' || domainOf(t) === domain); }

function counts() {
  let overdue = 0, soon = 0, ok = 0, never = 0;
  const dts = dTasks();
  for (const t of dts) {
    const s = taskStatus(t).key;
    if (s === 'overdue') overdue++; else if (s === 'soon') soon++; else if (s === 'ok') ok++; else never++;
  }
  const yr = String(new Date().getFullYear());
  let doneThisYear = 0;
  for (const t of dts) for (const d of (data.completions[t.id] || [])) if (d.startsWith(yr)) doneThisYear++;
  return { overdue, soon, ok, never, doneThisYear };
}

/* Life Score: each check scores by timeliness - on-track 100, due soon 70,
   overdue 30, not started 0. Fitness scores by weekly progress (count/target).
   A domain's score is the average of its checks; Life Score averages all checks. */
function taskScore(t) {
  if (t.months === 'w') return Math.min(1, weekCount(t) / (t.target || 4)) * 100;
  const k = taskStatus(t).key;
  return k === 'ok' ? 100 : k === 'soon' ? 70 : k === 'overdue' ? 30 : 0;
}
function lifeScoreExact(list) {
  if (!list.length) return 0;
  return list.reduce((s, t) => s + taskScore(t), 0) / list.length;
}
function lifeScore(list) { return Math.round(lifeScoreExact(list)); }
function scoreColor(sc) { return sc >= 80 ? 'var(--good)' : sc >= 50 ? 'var(--warning)' : 'var(--critical)'; }

function renderLanding() {

  let doneMonth = 0, doneTasksYear = 0;
  for (const t of TASKS) {
    const cs = data.completions[t.id] || [];
    if (cs.some(d => d.startsWith(y))) doneTasksYear++;
    for (const d of cs) if (d.startsWith(ym)) doneMonth++;
  }

  const sc = lifeScore(TASKS);
  const C = 2 * Math.PI * 40;
  const scoreHtml = `<div class="score-card">

          stroke-linecap="round" stroke-dasharray="${(sc / 100 * C).toFixed(1)} ${C.toFixed(1)}"/>
      </svg>

    </div>

    </div>
  </div>`;

  const statsHtml = `<div class="stats">
    <div class="stat" data-f="overdue"><div class="n ${gOd ? 'crit' : ''}">${gOd}</div><div class="l">Overdue</div></div>
    <div class="stat" data-f="soon"><div class="n ${gSoon ? 'warn' : ''}">${gSoon}</div><div class="l">Due soon</div></div>
    <div class="stat"><div class="n">${doneMonth}</div><div class="l">Done this month</div></div>
    <div class="stat"><div class="n ok" style="font-size:17px;letter-spacing:-0.02em;line-height:1.5">${doneTasksYear}/${TASKS.length}</div><div class="l">Done in ${y}</div></div>
  </div>`;

  const doms = [['all','🗂️','All Checklists'],['home','🏠','Home Maintenance'],['auto','🚗','Car Maintenance'],['health','❤️','Health Maintenance'],['pets','🐾','Pet Maintenance'],['admin','📋','Life Admin PM']];
  const cardsHtml = doms.map(([d, e, l]) => {
    const ts = TASKS.filter(t => d === 'all' || domainOf(t) === d);
    let od = 0, soon = 0, never = 0;
    ts.forEach(t => { const k = taskStatus(t).key; if (k === 'overdue') od++; else if (k === 'soon') soon++; else if (k === 'never') never++; });

    if (!od && !soon) parts.push(never ? never + ' not started' : '✅ all on track');

    return `<div class="land-card" data-d="${d}">
      <div class="land-emoji">${e}</div>
      <div><div class="land-t">${l}</div><div class="land-sub">${parts.join(' · ')}</div></div>
      <div class="land-arrow">›</div>
    </div>`;
  }).join('');

  $('landing').innerHTML =

    + scoreHtml + statsHtml
    + `<div class="group-h" style="margin-top:20px"><h2>Preventive Maintenance Checklists</h2></div>`

  $('doneDateBtn').onclick = () => { const v = $('doneDate').value; if (v) markDone(id, v); };
  const ub = $('undoBtn'); if (ub) ub.onclick = () => undoLast(id);
  $('overlay').classList.add('open');

  $('sheet').scrollTop = 0;
}
function closeTask() { $('overlay').classList.remove('open'); document.body.style.overflow = ''; openId = null; }
$('overlay').addEventListener('click', e => { if (e.target === $('overlay')) closeTask(); });

function markDone(id, dateISO) {
  const before = lifeScoreExact(TASKS);
  if (!data.completions[id]) data.completions[id] = [];
  data.completions[id].push(dateISO);
  data.completions[id].sort();
  saveData(data);
  const t = TASKS.find(x => x.id === id);
  closeTask();
  renderAll();
  const delta = lifeScoreExact(TASKS) - before;
  const dTxt = delta > 0.04 ? ' · Score +' + delta.toFixed(1) : '';
  if (t.months === 'w') {
    const c = weekCount(t), target = t.target || 4;
    toast((c >= target ? `🎉 ${c}/${target} - week complete!` : `✓ Logged - ${c}/${target} this week`) + dTxt);
  } else {
    const next = addMonths(parseISO(dateISO), t.months);
    toast('✓ Saved - next due ' + fmt(next) + dTxt);
  }
}
function undoLast(id) {
  const c = data.completions[id];
  if (c && c.length) { c.pop(); saveData(data); openTask(id); renderAll(); toast('Last completion removed'); }
}

    <div class="sec"><h3>Location</h3><input class="p-input" id="pLoc" value="${esc(p.location)}" placeholder="City, State"></div>
    <div class="sec"><h3>Age</h3><input class="p-input" id="pAge" type="number" min="1" max="120" inputmode="numeric" value="${esc(p.age)}" placeholder="Age in years"></div>
    <div class="actions"><button class="btn primary" id="pSave">Save profile</button></div>`;
  $('closeBtn').onclick = closeTask;
  $('pSave').onclick = () => {
    data.profile = {
      name: $('pName').value.trim() || 'You',
      location: $('pLoc').value.trim(),
      age: $('pAge').value.trim(),
    };
    saveData(data);
    renderProfile();
    closeTask();
    toast('Profile saved');
  };
  $('overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  $('sheet').scrollTop = 0;
}
$('profileBtn').onclick = openProfile;
renderProfile();

/* Day / night toggle: follows the phone's setting until you tap the button */
const THEME_KEY = 'ukg-theme';
function storedTheme() { try { return localStorage.getItem(THEME_KEY); } catch (e) { return null; } }
function applyTheme() {
  const s = storedTheme();
  const root = document.documentElement;
  if (s === 'light' || s === 'dark') root.setAttribute('data-theme', s);
  else root.removeAttribute('data-theme');
  const dark = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  $('themeBtn').textContent = dark ? '☀️' : '🌙';
}
$('themeBtn').onclick = () => {
  const s = storedTheme();
  const dark = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  try { localStorage.setItem(THEME_KEY, dark ? 'light' : 'dark'); } catch (e) {}
  applyTheme();
};
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
applyTheme();
